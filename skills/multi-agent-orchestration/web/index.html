<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Multi-Agent Control Tower</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MULTI-AGENT ORCHESTRATION</div>
        <h1>协作控制塔</h1>
      </div>
      <nav class="nav">
        <a class="nav-link active" href="/">总览</a>
        <a class="nav-link primary" href="/add">＋ 添加任务</a>
      </nav>
    </header>
    <main>
      <section class="hero-row">
        <div>
          <p class="lede">1 号总管、2 号独立门禁、3/4/5 动态 Worker。控制面收口、观察面共享；不可变 Record 保存协作事实，Git 负责持久化。</p>
          <div class="live"><span class="pulse"></span> 本机持久化状态 <span id="updatedAt">正在读取…</span></div>
        </div>
        <div id="summary" class="summary-grid" aria-live="polite"></div>
      </section>
      <section id="projects" class="projects" aria-live="polite"><div class="loading">正在重放 orchestration Record…</div></section>
      <section id="detailView" class="detail-view" aria-live="polite" aria-label="详情" hidden>
        <div class="detail-toolbar"><div><div class="section-kicker">DETAIL</div><div id="detailBreadcrumb" class="detail-breadcrumb"></div></div><button id="detailClose" class="detail-close" type="button">返回总览</button></div>
        <div id="detailContent"></div>
      </section>
    </main>
  </div>
  <script src="/assets/dashboard.js" defer></script>
</body>
</html>
